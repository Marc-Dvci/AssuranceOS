[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assuranceos"
version = "0.8.0"
description = "Governed AI-native internal audit hackathon vertical slice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "python-dateutil>=2.9,<3",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "cryptography>=50,<51",
  "python-dotenv>=1.1,<2",
  "defusedxml>=0.7,<1",
  # Windows ships no system IANA database; the recurring audit scheduler resolves
  # IANA zone names through zoneinfo and fails closed without it.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
otel = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.7,<1",
  "httpx2>=2.7,<3",
  "pip-audit>=2.9,<3",
  "bandit>=1.8,<2",
  # The OpenTelemetry bridge is exercised for real in the test suite rather than
  # assumed to work when the optional extra is present.
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]
gcp-runtime = [
  "google-cloud-storage>=2.18,<4",
  "google-cloud-secret-manager>=2.21,<3",
  "google-cloud-pubsub>=2.27,<3",
  "google-cloud-logging>=3.11,<4",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-gcp-trace>=1.9,<2",
]
agent-cloud = [
  "google-cloud-aiplatform[agent_engines,adk]>=1.163,<2",
  # Also the transport for EmbeddingGemma on Vertex AI.
  "google-genai>=2.9,<3",
]
# Chirp 3, for walkthrough-interview transcription. Separate from agent-cloud on
# purpose: an engagement that never records an interview should not carry a
# speech dependency, and a deployment that must not transcribe can then prove the
# library is absent instead of trusting a configuration flag.
speech = [
  "google-cloud-speech>=2.28,<3",
]
cloud = [
  "google-cloud-storage>=2.18,<4",
  "google-cloud-secret-manager>=2.21,<3",
  "google-cloud-pubsub>=2.27,<3",
  "google-cloud-logging>=3.11,<4",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-gcp-trace>=1.9,<2",
  "google-cloud-aiplatform[agent_engines,adk]>=1.163,<2",
  "google-genai>=2.9,<3",
  "google-cloud-speech>=2.28,<3",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
# "." is here because two test modules import from `scripts`, which is a
# directory of entrypoints rather than an installed package. `python -m pytest`
# puts the working directory on sys.path and a bare `pytest` does not, so those
# tests passed locally and failed collection in CI, which runs the bare form.
# Declaring the path makes the suite independent of how it was invoked instead of
# depending on an accident of the launcher.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly. CI installs ruff from a version range, and the implicit
# default ruleset widens between ruff releases, so an inherited default turns a
# routine dependency bump into a red build on untouched files. Broadening this
# set is a deliberate, separately reviewable change.
select = ["E4", "E7", "E9", "F"]
