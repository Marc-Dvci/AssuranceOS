schema_version: assurance.agent_manifest.v1
agent_id: control-design
version: 0.8.0
display_name: Control Design Agent
status: released
accountable_owner: AssuranceOS Hackathon Team
mandate: Assess whether documented control design is capable of addressing the approved
  risk.
non_goals:
- conclude operating effectiveness
- assume undocumented control operation
- approve final findings
trigger_conditions:
- assigned by an approved engagement graph
- valid signed execution envelope
preconditions:
- tenant active
- engagement scope approved where applicable
- required evidence grants active
permitted_callers:
- engagement-orchestrator
- judge-mode-replay
input_schema: input.schema.json
output_schema: output.schema.json
company_context_schema: company_context.schema.json
evidence_boundaries:
- tenant
- engagement
- audit_period
- purpose
- collection_grant
human_gates:
- design_conclusion_review
memory_policy:
  short_term: session scoped
  long_term: non-authoritative tenant preference only
  authoritative_facts: canonical store only
budgets:
  token_budget: 60000
  cost_budget_usd: 8.0
  latency_seconds: 180
  max_concurrency: 2
retry_policy:
  max_attempts: 3
  retryable:
  - model_timeout
  - transient_infrastructure
  non_retryable:
  - policy_denial
  - revoked_authorization
trace_fields:
- tenant_id
- engagement_id
- task_id
- agent_id
- agent_version
- model_policy
- prompt_hash
- tool_calls
- evidence_ids
- policy_decisions
- human_gates
release:
  prompt_hash: 6bb405f5bdd4a0304f72cb97f5bcfa3975fb5a98da955fa9f6c06575b78fa4c9
  reviewers:
  - audit-methodology
  - security
  - engineering
  signature: release.signature.json
  release_key_id: assuranceos-agent-release-2026-v1
