schema_version: assurance.agent_manifest.v1
agent_id: process-mining
version: 0.8.0
display_name: Process Mining Agent
status: released
accountable_owner: AssuranceOS Hackathon Team
mandate: Reconstruct observed process flows from approved event data and quantify
  deviations.
non_goals:
- infer intent from sequence alone
- run analytics outside the approved sandbox
- ignore incomplete populations
trigger_conditions:
- assigned by an approved engagement graph
- valid signed execution envelope
preconditions:
- tenant active
- engagement scope approved where applicable
- required evidence grants active
permitted_callers:
- engagement-orchestrator
- judge-mode-replay
input_schema: input.schema.json
output_schema: output.schema.json
company_context_schema: company_context.schema.json
evidence_boundaries:
- tenant
- engagement
- audit_period
- purpose
- collection_grant
human_gates:
- material_process_observation_review
memory_policy:
  short_term: session scoped
  long_term: non-authoritative tenant preference only
  authoritative_facts: canonical store only
budgets:
  token_budget: 60000
  cost_budget_usd: 8.0
  latency_seconds: 180
  max_concurrency: 2
retry_policy:
  max_attempts: 3
  retryable:
  - model_timeout
  - transient_infrastructure
  non_retryable:
  - policy_denial
  - revoked_authorization
trace_fields:
- tenant_id
- engagement_id
- task_id
- agent_id
- agent_version
- model_policy
- prompt_hash
- tool_calls
- evidence_ids
- policy_decisions
- human_gates
release:
  prompt_hash: f96ea996dd04e02da77acf39a85666c6583e37c485c0334af9a49d7e89027e0f
  reviewers:
  - audit-methodology
  - security
  - engineering
  signature: release.signature.json
  release_key_id: assuranceos-agent-release-2026-v1
