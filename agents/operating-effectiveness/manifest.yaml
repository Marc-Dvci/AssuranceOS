schema_version: assurance.agent_manifest.v1
agent_id: operating-effectiveness
version: 0.8.0
display_name: Operating Effectiveness Agent
status: released
accountable_owner: AssuranceOS Hackathon Team
mandate: Evaluate control operation through approved deterministic tests and accepted
  evidence.
non_goals:
- replace failed tests with model judgment
- treat missing evidence as a control failure
- approve final findings
trigger_conditions:
- assigned by an approved engagement graph
- valid signed execution envelope
preconditions:
- tenant active
- engagement scope approved where applicable
- required evidence grants active
permitted_callers:
- engagement-orchestrator
- judge-mode-replay
input_schema: input.schema.json
output_schema: output.schema.json
company_context_schema: company_context.schema.json
evidence_boundaries:
- tenant
- engagement
- audit_period
- purpose
- collection_grant
human_gates:
- test_result_acceptance
memory_policy:
  short_term: session scoped
  long_term: non-authoritative tenant preference only
  authoritative_facts: canonical store only
budgets:
  token_budget: 60000
  cost_budget_usd: 8.0
  latency_seconds: 180
  max_concurrency: 2
retry_policy:
  max_attempts: 3
  retryable:
  - model_timeout
  - transient_infrastructure
  non_retryable:
  - policy_denial
  - revoked_authorization
trace_fields:
- tenant_id
- engagement_id
- task_id
- agent_id
- agent_version
- model_policy
- prompt_hash
- tool_calls
- evidence_ids
- policy_decisions
- human_gates
release:
  prompt_hash: ff0e37ebffd90cd8b147d688e96f61f907332dac88d4951a2bfd66e9e64b131e
  reviewers:
  - audit-methodology
  - security
  - engineering
  signature: release.signature.json
  release_key_id: assuranceos-agent-release-2026-v1
