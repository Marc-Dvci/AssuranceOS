<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9aa0a6"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><text x="60" y="56" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#202124" text-anchor="start" opacity="1.0">One commitment, three systems, one answer that is right</text><text x="60" y="82" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start" opacity="1.0">Asteria Systems, the synthetic company the demonstration audits</text><rect x="60" y="130" width="340" height="92" rx="12" fill="#e8f0fe" stroke="#dadce0" stroke-width="1"/><rect x="60" y="130" width="4" height="92" rx="2" fill="#1a73e8"/><text x="230.0" y="160" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle" opacity="1.0">Customer contract amendment</text><text x="230.0" y="182" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">priority one first response: 4 hours</text><text x="230.0" y="200" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">in force from 1 April</text><rect x="60" y="232" width="107.36000000000001" height="22" rx="11.0" fill="#e8f0fe" stroke="none" stroke-width="1"/><text x="113.68" y="247.32" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#1a73e8" text-anchor="middle" opacity="1.0">the authority</text><rect x="60" y="282" width="340" height="84" rx="12" fill="#fef7e0" stroke="#dadce0" stroke-width="1"/><rect x="60" y="282" width="4" height="84" rx="2" fill="#b06000"/><text x="230.0" y="312" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle" opacity="1.0">Incident response plan</text><text x="230.0" y="334" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">still says 8 hours</text><rect x="60" y="386" width="340" height="84" rx="12" fill="#fef7e0" stroke="#dadce0" stroke-width="1"/><rect x="60" y="386" width="4" height="84" rx="2" fill="#b06000"/><text x="230.0" y="416" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle" opacity="1.0">Jira SLA automation</text><text x="230.0" y="438" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">still marks every ticket met at 8 hours</text><rect x="480" y="232" width="260" height="130" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1"/><rect x="480" y="232" width="4" height="130" rx="2" fill="#1a73e8"/><text x="610.0" y="262" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle" opacity="1.0">SLA-01</text><text x="610.0" y="284" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">signed control test</text><text x="610.0" y="302" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">9 incidents reconciled</text><text x="610.0" y="320" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">5 in period</text><polyline points="400,176 474,297" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><polyline points="400,324 474,324" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><polyline points="400,428 474,297" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="820" y="150" width="320" height="96" rx="12" fill="#fce8e6" stroke="#dadce0" stroke-width="1"/><rect x="820" y="150" width="4" height="96" rx="2" fill="#c5221f"/><text x="980.0" y="180" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle" opacity="1.0">3 of 5 breached</text><text x="980.0" y="202" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">while their tickets read met</text><text x="980.0" y="220" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">EUR 7,200 monthly service credits</text><rect x="820" y="286" width="320" height="110" rx="12" fill="#e6f4ea" stroke="#dadce0" stroke-width="1"/><rect x="820" y="286" width="4" height="110" rx="2" fill="#188038"/><text x="980.0" y="316" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#202124" text-anchor="middle" opacity="1.0">2 look alikes not reported</text><text x="980.0" y="338" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">one customer never amended its contract,</text><text x="980.0" y="356" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">one incident predates the amendment,</text><text x="980.0" y="374" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" text-anchor="middle" opacity="1.0">both refusals recorded with reasons</text><polyline points="740,280 814,200" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><polyline points="740,316 814,336" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><text x="60" y="512" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#5f6368" text-anchor="start" opacity="1.0">Every internal system agrees with every other internal system, and all of them disagree with the contract.</text></svg>
