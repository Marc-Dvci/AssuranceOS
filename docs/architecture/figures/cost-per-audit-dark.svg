<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7f858a"/></marker></defs><rect width="1200" height="400" fill="#1b1c1e"/><text x="60" y="60" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#e8eaed" text-anchor="start" opacity="1.0">What one audit costs to run</text><text x="60" y="86" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#9aa0a6" text-anchor="start" opacity="1.0">Metered on every model call, priced at the published Gemini 3.7 Flash rate and rendered in the product.</text><rect x="60" y="132" width="340" height="150" rx="12" fill="#202124" stroke="#3c4043" stroke-width="1"/><rect x="60" y="132" width="340" height="4" rx="2" fill="#8ab4f8"/><text x="230" y="202" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="600" fill="#8ab4f8" text-anchor="middle" opacity="1.0">$0.19</text><text x="230" y="232" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e8eaed" text-anchor="middle" opacity="1.0">50 documents</text><text x="230" y="256" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9aa0a6" text-anchor="middle" opacity="1.0">a single control, one system</text><rect x="440" y="132" width="340" height="150" rx="12" fill="#202124" stroke="#3c4043" stroke-width="1"/><rect x="440" y="132" width="340" height="4" rx="2" fill="#8ab4f8"/><text x="610" y="202" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="600" fill="#8ab4f8" text-anchor="middle" opacity="1.0">$1.81</text><text x="610" y="232" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e8eaed" text-anchor="middle" opacity="1.0">500 documents</text><text x="610" y="256" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9aa0a6" text-anchor="middle" opacity="1.0">a full engagement</text><rect x="820" y="132" width="340" height="150" rx="12" fill="#202124" stroke="#3c4043" stroke-width="1"/><rect x="820" y="132" width="340" height="4" rx="2" fill="#8ab4f8"/><text x="990" y="202" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="600" fill="#8ab4f8" text-anchor="middle" opacity="1.0">$18.01</text><text x="990" y="232" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e8eaed" text-anchor="middle" opacity="1.0">5,000 documents</text><text x="990" y="256" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9aa0a6" text-anchor="middle" opacity="1.0">an annual programme</text><text x="60" y="336" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#9aa0a6" text-anchor="start" opacity="1.0">For comparison, one internal auditor is $68,750 to $99,750 in base salary, and on site audit support in the US</text><text x="60" y="356" font-family="'Google Sans','Google Sans Text',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#9aa0a6" text-anchor="start" opacity="1.0">is quoted at $100 to $200 an hour. Sources: Robert Half 2026 Salary Guide, published outsourcing rate cards.</text></svg>
