schema: assurance.capability_status.v3
release: 0.8.0

# Two axes, deliberately separated.
#
# The previous version of this file carried one status per capability, which
# conflated "is it built" with "has it been pointed at a paid provider". That
# made every Google-managed integration read as unfinished when what was true
# was narrower and less interesting: the code, the contract and the tests exist
# and pass, and the account credentials had not been attached yet.
#
# So `implementation` describes the software and `activation` describes the
# deployment. A capability can be complete on the first axis and dormant on the
# second, and saying so is the whole point of the file.

implementation_definitions:
  complete: Executable code, migrations, tests, API surface, and evaluator proof exist and pass.
  partial: Some contracted behaviour is stubbed or deferred. None currently.

activation_definitions:
  not_required: Runs with no external provider. Local release gates prove it.
  credentials_pending: Adapter and contract are exercised against deterministic transports; a provider account has not been attached.
  provider_verified: Exercised against the live provider, with a recorded operator receipt.

capabilities:
  canonical_domain_database: {implementation: complete, activation: not_required}
  durable_engagement_orchestrator: {implementation: complete, activation: not_required}
  recurring_audit_scheduler: {implementation: complete, activation: not_required}
  evidence_vault_and_provenance: {implementation: complete, activation: not_required}
  connector_sdk_and_provider_adapters: {implementation: complete, activation: credentials_pending}
  deterministic_control_test_engine: {implementation: complete, activation: not_required}
  signed_versioned_test_registry: {implementation: complete, activation: not_required}
  standards_and_audit_pack_compiler: {implementation: complete, activation: not_required}
  organization_onboarding_and_intelligence: {implementation: complete, activation: not_required}
  risk_portfolio_and_plan_recommendations: {implementation: complete, activation: not_required}
  finding_adjudication_and_materiality: {implementation: complete, activation: not_required}
  remediation_ticketing_and_independent_retest: {implementation: complete, activation: not_required}
  evidence_grounded_reporting_and_cockpit: {implementation: complete, activation: not_required}
  continuous_monitoring_review_cases: {implementation: complete, activation: not_required}
  local_privacy_model_runtime: {implementation: complete, activation: provider_verified}
  signed_agent_packages: {implementation: complete, activation: not_required}
  judge_mode_live_proofs: {implementation: complete, activation: not_required}

# The three mandatory hackathon requirements, and one optional platform service.
#
# Each names the code path that satisfies it and the artefact that would record
# a live activation. `activation` here is an operational fact about one
# deployment, never a statement about whether the integration is finished.
google_platform:
  gemini_3_7_structured_runtime:
    requirement: Gemini 3.5 or newer through the Gemini API or Vertex AI
    implementation: complete
    activation: provider_verified
    code: src/assuranceos/governance/models_client.py
    evidence_when_activated: Cloud Trace span with gen_ai.system=gcp.gemini, and the Judge Mode Agent Runtime tile
    note: >-
      The same governed runtime holds three transports behind one contract and
      never learns which it is talking to. Activated 2026-08-15 on project
      audit-505613: the deployed service reports model_mode=vertex on /health and
      the walkthrough's agent run was served by gemini-3.7-flash through Vertex.
  adk_managed_fleet_deployment:
    requirement: At least one Google agent framework
    implementation: complete
    activation: provider_verified
    code: src/assuranceos/adk.py, src/assuranceos/managed_fleet.py, scripts/deploy_adk_agent.py
    evidence_when_activated: release/agent-engine-deployment-result.json, with all 19 reasoningEngines resource names read back
    activated:
      date: 2026-08-16
      project: audit-505613
      location: us-central1
      receipt: release/agent-engine-deployment-result.json
      deployed: 19 of 19 packages, no failures, each resource read back through the API
      qualification: 76 of 76 release cases across 19 agents, passed before any resource was created
      identity: managed Agent Identity on every engine
      model: gemini-3.7-flash
    note: >-
      The hackathon's agent-framework requirement is met by the Google GenAI SDK,
      which is provider_verified above. This entry is the further step of running
      the same signed fleet on managed Agent Engine, and it is now activated.
      Deployment is all-or-nothing across the nineteen packages and gated on the
      qualification suite, so nothing is created until 19/19 agents pass all 76
      release cases. Two earlier attempts on 2026-08-16 created a reasoning engine
      and failed while building the runtime image: the deployment did not declare
      `cloudpickle`, which the SDK serialises the agent with, and it shipped
      `src/assuranceos` as a directory, which left the container starting with
      `ModuleNotFoundError: No module named 'assuranceos'`. It now builds a wheel
      and names it where the builder places it inside the build context. No
      resource from those attempts survived; each was removed before the run that
      produced the receipt.
  vertex_ai_memory_bank:
    implementation: complete
    activation: provider_verified
    code: src/assuranceos/managed_fleet.py
    evidence_when_activated: memory bank configuration confirmed per agent in the same deployment result
    activated:
      date: 2026-08-16
      receipt: release/agent-engine-deployment-result.json
      service: VertexAiMemoryBankService, configured on all 19 engines
      generation: explicit_after_review, so a session reaches memory only once it has been approved for it
      tenant_isolation: tenant-qualified user_id scope key
      ttl: 31536000s memory-revision default
      generation_model: gemini-3.7-flash
      similarity_search_model: text-embedding-005
  google_model_armor:
    implementation: complete
    activation: provider_verified
    code: src/assuranceos/governance/managed_armor.py
    evidence_when_activated: one sanitize-operation log entry, and screened_by on a prompt-injection replay
    activated:
      date: 2026-08-16
      template: projects/audit-505613/locations/us-central1/templates/assuranceos-guardrails
      filters: prompt injection and jailbreak at LOW_AND_ABOVE, malicious URI enabled, sensitive-data inspection disabled
      screened: >-
        Every one of the 51 text files in the Asteria corpus was submitted to
        sanitizeUserPrompt. Exactly one returned MATCH_FOUND:
        confluence/change_management_policy.md, which is the page carrying the
        seeded prompt injection. The other 50 returned NO_MATCH_FOUND.
      note: >-
        The earlier PERMISSION_DENIED was not a billing or enablement problem.
        Model Armor is not covered by roles/owner, so template administration has
        to be granted explicitly with roles/modelarmor.admin even for the project
        owner. The gcloud model-armor surface also addresses a different endpoint
        than the regional one the service uses; the API answers at
        modelarmor.us-central1.rep.googleapis.com, which is what
        managed_armor.py already calls.
      sensitive_data_inspection: >-
        Left disabled deliberately. The guardrail runs inline on the seed jobs and
        fails closed on any match, so a sensitive-data filter matching the HR and
        identity extracts would block the demonstration corpus rather than the
        attack in it. Prompt injection is the property this control exists to
        enforce, and it is the property that was measured.
  google_cloud_infrastructure:
    requirement: At least one Google Cloud infrastructure service
    implementation: complete
    activation: provider_verified
    code: infrastructure/terraform/ (35 resources: Cloud Run service and 5 jobs, Cloud SQL, Cloud Storage, Pub/Sub, Secret Manager, Cloud Scheduler, Cloud Trace, Artifact Registry)
    evidence_when_activated: terraform outputs, the Cloud Run revision, and job execution logs
    activated:
      date: 2026-08-15
      project: audit-505613
      region: us-central1
      service: assuranceos-demo-api
      url: https://assuranceos-demo-api-u34b6gbpma-uc.a.run.app
      database: Cloud SQL for PostgreSQL 16 (assuranceos-demo-postgres)
      jobs_run: migrate, seed-demo, control-test, each completed with exit 0
      readiness: /ready reports database, agent_registry, control_test_registry and control_test_registry_database all true

