schema: assurance.capability_status.v1
release: 0.8.0
scope_policy: The original implementation plan remains authoritative; absence from Components 1-6 does not remove a capability.
status_definitions:
  implemented: Executable code, migrations, tests, and an observable demonstration exist.
  contract_defined: Schemas, invariants, and acceptance criteria are retained, but the capability is not claimed as executable.
  external_validation_required: Code exists, but proof requires a cloud project, provider tenant, credentials, or production traffic.
