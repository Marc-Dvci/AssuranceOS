schema: assurance.capability_status.v2
release: 0.8.0
status_definitions:
  implemented: Executable code, migrations, tests, APIs, and evaluator proof exist.
  integration_ready: Executable adapter and contract exist; activation requires provider credentials.
  release_qualified: Signed artifacts and deployment configuration pass local release gates; no cloud runtime is claimed.
  cloud_verified: An operator receipt records successful live API read-back of every expected Google Cloud resource.
