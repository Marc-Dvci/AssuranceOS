name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  python-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.17
      - run: uv sync --frozen --extra dev --extra postgres --extra agent-cloud
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: Static security analysis
        run: bandit -q -lll -r src scripts
      - name: Repository secret patterns and signed releases
        run: python scripts/validate_repo.py
      - name: Build production image
        run: docker build --tag assuranceos-security .
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: assuranceos-security
          format: spdx-json
          output-file: assuranceos.spdx.json
          artifact-name: assuranceos.spdx.json
      - name: Scan production image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: assuranceos-security
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: python,actions
          queries: security-extended
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
