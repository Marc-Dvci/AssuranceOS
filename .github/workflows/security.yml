name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  # CodeQL reads the workflow run it is analysing, and on a private repository
  # the default token cannot. Without this, analyze uploads its SARIF and then
  # fails the job on "Resource not accessible by integration".
  actions: read

jobs:
  python-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.17
      - run: uv sync --frozen --extra dev --extra postgres --extra agent-cloud
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: Static security analysis
        run: bandit -q -lll -r src scripts
      - name: Repository secret patterns and signed releases
        run: python scripts/validate_repo.py
      - name: Build production image
        run: docker build --tag assuranceos-security .
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: assuranceos-security
          format: spdx-json
          output-file: assuranceos.spdx.json
          artifact-name: assuranceos.spdx.json
      - name: Scan production image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: assuranceos-security
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python,actions
          queries: security-extended
      # Uploading to the code-scanning API needs code scanning enabled, which a
      # private repository without Advanced Security does not have. So the
      # upload follows the repository's visibility and the SARIF is always
      # written to disk, where the next step decides the outcome. The gate is
      # then the analysis itself rather than the feature flag, and it behaves
      # the same whichever side of public the repository is on.
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: var/codeql-results
      - name: Fail on high or critical CodeQL findings
        run: python3 scripts/check_codeql_sarif.py var/codeql-results
