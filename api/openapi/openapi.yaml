components:
  schemas:
    AdjudicateFindingRequest:
      properties:
        decision:
          $ref: '#/components/schemas/HumanDecision'
        reason:
          type: string
          maxLength: 4000
          minLength: 3
          title: Reason
        idempotency_key:
          type: string
          maxLength: 255
          minLength: 3
          title: Idempotency Key
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
      type: object
      required:
      - decision
      - reason
      - idempotency_key
      title: AdjudicateFindingRequest
    AgentReleaseProof:
      properties:
        agent_id:
          type: string
          title: Agent Id
        display_name:
          type: string
          title: Display Name
        version:
          type: string
          title: Version
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
        release_status:
          type: string
          const: signed
          title: Release Status
        release_digest:
          type: string
          title: Release Digest
        tool_count:
          type: integer
          title: Tool Count
        human_gates:
          items:
            type: string
          type: array
          title: Human Gates
        deployment_target:
          type: string
          title: Deployment Target
      type: object
      required:
      - agent_id
      - display_name
      - version
      - owner
      - release_status
      - release_digest
      - tool_count
      - human_gates
      - deployment_target
      title: AgentReleaseProof
    ApprovePackRequest:
      properties:
        reason:
          type: string
          maxLength: 4000
          minLength: 10
          title: Reason
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
      type: object
      required:
      - reason
      title: ApprovePackRequest
    ApprovePlanRequest:
      properties:
        reason:
          type: string
          maxLength: 4000
          minLength: 10
          title: Reason
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
      type: object
      required:
      - reason
      title: ApprovePlanRequest
    ArmorDetectorProof:
      properties:
        detector:
          type: string
          title: Detector
        category:
          type: string
          title: Category
        severity:
          type: string
          title: Severity
        match_count:
          type: integer
          title: Match Count
        excerpt_digest:
          type: string
          title: Excerpt Digest
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detector
      - category
      - severity
      - match_count
      - excerpt_digest
      - detail
      title: ArmorDetectorProof
    AssessMaterialityRequest:
      properties:
        inputs:
          $ref: '#/components/schemas/MaterialityInputs'
        policy:
          anyOf:
          - $ref: '#/components/schemas/MaterialityPolicy'
          - type: 'null'
        assessed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessed By
      type: object
      required:
      - inputs
      title: AssessMaterialityRequest
      description: 'Measured inputs for a materiality score, and the policy to score
        them under.


        ``assessed_by`` is not restricted to a person the way a decision is. An agent

        may compute this: the score is arithmetic over declared inputs, and what an

        agent must not reach is the approval that follows it.'
    AssessRiskRequest:
      properties:
        factors:
          $ref: '#/components/schemas/RiskFactors'
        as_at:
          type: string
          format: date
          title: As At
        policy:
          anyOf:
          - $ref: '#/components/schemas/ScoringPolicy'
          - type: 'null'
        assessed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessed By
      type: object
      required:
      - factors
      - as_at
      title: AssessRiskRequest
      description: 'Declared inputs for a risk rating, and the date to score them
        as at.


        ``as_at`` is required rather than defaulted to today. Ratings are recomputed

        retrospectively often enough that letting the server pick the date makes

        staleness unmeasurable.'
    AssuranceSource:
      type: string
      enum:
      - internal_audit
      - external_audit
      - continuous_monitor
      - management_testing
      - regulatory_examination
      - none
      title: AssuranceSource
      description: 'Where assurance over a risk comes from, and how much it is worth.


        Reliance differs by source and the differences are not opinions: an internal

        audit engagement was performed by people who report to the audit committee,

        management self-testing was not, and a continuous monitor covers a narrow

        question continuously rather than a broad one once.'
    AuditPeriodRule:
      properties:
        kind:
          type: string
          enum:
          - calendar_months
          - rolling_days
          title: Kind
          default: calendar_months
        months:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Months
          default: 1
        days:
          type: integer
          maximum: 3660.0
          minimum: 1.0
          title: Days
          default: 30
        end_offset_days:
          type: integer
          maximum: 3660.0
          minimum: 0.0
          title: End Offset Days
          default: 1
      additionalProperties: false
      type: object
      title: AuditPeriodRule
    BlackoutPolicy:
      properties:
        windows:
          items:
            $ref: '#/components/schemas/BlackoutWindow'
          type: array
          title: Windows
      additionalProperties: false
      type: object
      title: BlackoutPolicy
    BlackoutWindow:
      properties:
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
        behavior:
          type: string
          enum:
          - delay
          - skip
          title: Behavior
          default: delay
        reason:
          type: string
          maxLength: 500
          minLength: 1
          title: Reason
          default: configured blackout window
      additionalProperties: false
      type: object
      required:
      - start
      - end
      title: BlackoutWindow
    BusinessCalendarConfig:
      properties:
        weekend_days:
          items:
            type: integer
          type: array
          uniqueItems: true
          title: Weekend Days
        holidays:
          items:
            type: string
            format: date
          type: array
          uniqueItems: true
          title: Holidays
      additionalProperties: false
      type: object
      title: BusinessCalendarConfig
    CancellationRequest:
      properties:
        actor_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
      type: object
      required:
      - actor_id
      - reason
      title: CancellationRequest
    Candidate:
      properties:
        candidate_key:
          type: string
          maxLength: 128
          minLength: 1
          title: Candidate Key
        entity_ref:
          type: string
          maxLength: 128
          minLength: 1
          title: Entity Ref
        risk_ref:
          type: string
          maxLength: 64
          minLength: 1
          title: Risk Ref
        title:
          type: string
          maxLength: 255
          minLength: 3
          title: Title
        objective:
          type: string
          minLength: 10
          title: Objective
        score:
          $ref: '#/components/schemas/RiskScore'
        effort_days:
          type: number
          exclusiveMinimum: 0.0
          title: Effort Days
        criticality:
          type: number
          maximum: 5.0
          minimum: 0.0
          title: Criticality
          default: 0
        disruption:
          type: string
          enum:
          - low
          - medium
          - high
          title: Disruption
          default: medium
        expertise_required:
          items:
            type: string
          type: array
          title: Expertise Required
        expertise_available:
          type: boolean
          title: Expertise Available
          default: true
        last_audited_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Last Audited On
        data_dependencies:
          items:
            type: string
          type: array
          title: Data Dependencies
        suggested_cadence_months:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Suggested Cadence Months
          default: 12
        audit_pack_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Pack Ref
      additionalProperties: false
      type: object
      required:
      - candidate_key
      - entity_ref
      - risk_ref
      - title
      - objective
      - score
      - effort_days
      title: Candidate
      description: 'One auditable thing, scored and costed.


        ``effort_days`` and the qualitative columns are declared rather than inferred.

        A planner that estimates its own costs is a planner whose recommendations

        cannot be argued with.'
    CapacityPolicy:
      properties:
        horizon_start:
          type: string
          format: date
          title: Horizon Start
        horizon_end:
          type: string
          format: date
          title: Horizon End
        available_days:
          type: number
          exclusiveMinimum: 0.0
          title: Available Days
        minimum_coverage_criticality:
          type: number
          maximum: 5.0
          minimum: 0.0
          title: Minimum Coverage Criticality
          default: 4.0
        coverage_interval_months:
          type: integer
          maximum: 120.0
          minimum: 1.0
          title: Coverage Interval Months
          default: 24
        contingency_fraction:
          type: number
          maximum: 0.5
          minimum: 0.0
          title: Contingency Fraction
          default: 0.15
        max_high_disruption:
          type: integer
          minimum: 0.0
          title: Max High Disruption
          default: 2
      additionalProperties: false
      type: object
      required:
      - horizon_start
      - horizon_end
      - available_days
      title: CapacityPolicy
      description: What the audit function can actually deliver, and what it must
        cover.
