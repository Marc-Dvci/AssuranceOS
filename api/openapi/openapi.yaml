      description: 'A statement the report will make, and what it rests on.


        ``material`` defaults to True. The safe direction: a claim whose materiality

        nobody considered is treated as one the reader will act on, so forgetting
        to

        mark something material produces a refusal rather than an unsupported

        sentence.'
