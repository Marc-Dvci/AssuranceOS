        is refused rather than silently filed nowhere. Live provider credentials are

        resolved through the connector registry in a deployed environment; until one

        is configured, this endpoint serves the ``none`` case and reports the mismatch

        for the others instead of pretending to have written.'
      operationId: sync_remediation_ticket_api_v1_tenants__tenant_id__remediation_actions__action_id__ticket_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sync Remediation Ticket Api V1 Tenants  Tenant Id  Remediation
                  Actions  Action Id  Ticket Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tenants/{tenant_id}/remediation-actions/{action_id}/closure:
    post:
      summary: Submit Closure
      description: 'Record management''s assertion that an action is complete.


        An assertion is not a closure. Only an independent retest can close a finding.'
      operationId: submit_closure_api_v1_tenants__tenant_id__remediation_actions__action_id__closure_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitClosureRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Submit Closure Api V1 Tenants  Tenant Id  Remediation
                  Actions  Action Id  Closure Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tenants/{tenant_id}/remediation-actions/{action_id}/retests:
    post:
      summary: Record Retest
      description: 'Verify a declared remediation with an independent retest.


        Refused when the retester is the finding''s author, the remediation owner,
        or

        whoever declared it complete.'
      operationId: record_retest_api_v1_tenants__tenant_id__remediation_actions__action_id__retests_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRetestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Record Retest Api V1 Tenants  Tenant Id  Remediation
                  Actions  Action Id  Retests Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tenants/{tenant_id}/findings/recurrence/{code}:
    get:
      summary: Finding Recurrence
      description: The same control failing across more than one engagement.
      operationId: finding_recurrence_api_v1_tenants__tenant_id__findings_recurrence__code__get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Finding Recurrence Api V1 Tenants  Tenant Id  Findings
                  Recurrence  Code  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /judge:
    get:
      summary: Judge Mode
      operationId: judge_mode_judge_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    AdjudicateFindingRequest:
      properties:
        decision:
          $ref: '#/components/schemas/HumanDecision'
        reason:
          type: string
          maxLength: 4000
          minLength: 3
          title: Reason
        idempotency_key:
          type: string
          maxLength: 255
          minLength: 3
          title: Idempotency Key
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
      type: object
      required:
      - decision
      - reason
      - idempotency_key
      title: AdjudicateFindingRequest
    ApprovePackRequest:
      properties:
        reason:
          type: string
          maxLength: 4000
          minLength: 10
          title: Reason
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
      type: object
      required:
      - reason
      title: ApprovePackRequest
    AssessMaterialityRequest:
      properties:
        inputs:
          $ref: '#/components/schemas/MaterialityInputs'
        policy:
          anyOf:
          - $ref: '#/components/schemas/MaterialityPolicy'
          - type: 'null'
        assessed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessed By
      type: object
      required:
      - inputs
      title: AssessMaterialityRequest
      description: 'Measured inputs for a materiality score, and the policy to score
        them under.


        ``assessed_by`` is not restricted to a person the way a decision is. An agent

        may compute this: the score is arithmetic over declared inputs, and what an

        agent must not reach is the approval that follows it.'
    AuditPeriodRule:
      properties:
        kind:
          type: string
          enum:
          - calendar_months
          - rolling_days
          title: Kind
          default: calendar_months
        months:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Months
          default: 1
        days:
          type: integer
          maximum: 3660.0
          minimum: 1.0
          title: Days
          default: 30
        end_offset_days:
          type: integer
          maximum: 3660.0
          minimum: 0.0
          title: End Offset Days
          default: 1
      additionalProperties: false
      type: object
      title: AuditPeriodRule
    BlackoutPolicy:
      properties:
        windows:
          items:
            $ref: '#/components/schemas/BlackoutWindow'
          type: array
          title: Windows
      additionalProperties: false
      type: object
      title: BlackoutPolicy
    BlackoutWindow:
      properties:
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
        behavior:
          type: string
          enum:
          - delay
          - skip
          title: Behavior
          default: delay
        reason:
          type: string
          maxLength: 500
          minLength: 1
          title: Reason
          default: configured blackout window
      additionalProperties: false
      type: object
      required:
      - start
      - end
      title: BlackoutWindow
    BusinessCalendarConfig:
      properties:
        weekend_days:
          items:
            type: integer
          type: array
          uniqueItems: true
          title: Weekend Days
        holidays:
          items:
            type: string
            format: date
          type: array
          uniqueItems: true
          title: Holidays
      additionalProperties: false
      type: object
      title: BusinessCalendarConfig
    CancellationRequest:
      properties:
        actor_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
      type: object
      required:
      - actor_id
      - reason
      title: CancellationRequest
    ClaimStrength:
      type: string
      enum:
      - mandatory
      - recommended
      - informative
      title: ClaimStrength
      description: 'How firmly a criterion binds.


        A pack that cannot distinguish a regulatory requirement from an internal

        preference will report both as findings of the same kind, which is how an

        audit function loses the argument about which findings matter.'
    CollectionGrantInput:
      properties:
        grant_key:
          type: string
          maxLength: 255
          minLength: 1
          title: Grant Key
        purpose:
          type: string
          maxLength: 4000
          minLength: 1
          title: Purpose
        allowed_streams:
          items:
            type: string
          type: array
          minItems: 1
          title: Allowed Streams
        resource_selectors:
          additionalProperties: true
          type: object
          title: Resource Selectors
        approved_by:
          type: string
          maxLength: 255
          minLength: 1
          title: Approved By
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - grant_key
      - purpose
      - allowed_streams
      - approved_by
      title: CollectionGrantInput
    CompileEngagementRequest:
      properties:
        pack_id:
          type: string
          maxLength: 128
          minLength: 2
          title: Pack Id
        version:
          type: string
          maxLength: 32
          minLength: 1
          title: Version
        entity_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Entity Name
        period_start:
          type: string
          format: date
          title: Period Start
        period_end:
          type: string
          format: date
          title: Period End
        in_scope_systems:
          items:
            type: string
          type: array
          title: In Scope Systems
        profile_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Profile Version
        compiled_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Compiled By
      type: object
      required:
      - pack_id
      - version
      - entity_name
      - period_start
      - period_end
      title: CompileEngagementRequest
      description: 'Compile an approved pack into an engagement.


        The organisation context is supplied rather than read from wherever it

        happens to live, so the compilation record can state what the graph was a

        function of.'
    ConnectorInstanceInput:
      properties:
        connector_key:
          type: string
          maxLength: 128
          minLength: 1
          title: Connector Key
        connector_type:
          type: string
          maxLength: 64
          minLength: 1
          title: Connector Type
        display_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Display Name
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        config:
          additionalProperties: true
          type: object
          title: Config
      additionalProperties: false
      type: object
      required:
      - connector_key
      - connector_type
      - display_name
      title: ConnectorInstanceInput
    ControlTestDataset:
      properties:
        name:
          type: string
          title: Name
        records:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Records
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        authoritative:
          type: boolean
          title: Authoritative
          default: true
        expected_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Expected Count
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
      - name
      - records
      title: ControlTestDataset
    ControlTestExecutionRequest:
      properties:
        test_id:
          type: string
          title: Test Id
        version:
          type: string
          title: Version
        purpose:
          type: string
          maxLength: 4000
          minLength: 3
          title: Purpose
        period_start:
          type: string
          format: date
          title: Period Start
        period_end:
          type: string
          format: date
          title: Period End
        idempotency_key:
          type: string
          maxLength: 255
          minLength: 3
          title: Idempotency Key
        engagement_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Engagement Id
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
        datasets:
          items:
            $ref: '#/components/schemas/ControlTestDataset'
          type: array
          title: Datasets
      type: object
      required:
      - test_id
      - version
      - purpose
      - period_start
      - period_end
      - idempotency_key
      - datasets
      title: ControlTestExecutionRequest
    ControlTestReproductionRequest:
      properties:
        purpose:
          type: string
          maxLength: 4000
          minLength: 3
          title: Purpose
        period_start:
          type: string
          format: date
          title: Period Start
        period_end:
          type: string
          format: date
          title: Period End
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
        datasets:
          items:
            $ref: '#/components/schemas/ControlTestDataset'
          type: array
          title: Datasets
      type: object
      required:
      - purpose
      - period_start
      - period_end
      - datasets
      title: ControlTestReproductionRequest
    CriterionInput:
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 2
          title: Code
        text:
          type: string
          minLength: 10
          title: Text
        citation:
          type: string
          maxLength: 512
          minLength: 2
          title: Citation
        strength:
          $ref: '#/components/schemas/ClaimStrength'
          default: mandatory
        requirement_ref:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Requirement Ref
        effective_from:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective From
        effective_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective To
      additionalProperties: false
      type: object
      required:
      - code
      - text
      - citation
      title: CriterionInput
      description: 'One requirement inside a standard, with the citation that locates
        it.


        The citation is required. A finding that says "contrary to policy" without

        saying where in the policy is not a finding anyone can act on, and the place
        to

        enforce that is where the criterion is defined rather than where it is quoted.'
    CrosswalkRelation:
      type: string
      enum:
      - equivalent
      - subset
      - superset
      - related
      - conflicts
      title: CrosswalkRelation
      description: How one criterion relates to another in a different standard.
    CrosswalkRequest:
      properties:
        source_standard:
          type: string
          title: Source Standard
        source_version:
          type: string
          title: Source Version
        source_criterion:
          type: string
          title: Source Criterion
        target_standard:
          type: string
          title: Target Standard
        target_version:
          type: string
          title: Target Version
        target_criterion:
          type: string
          title: Target Criterion
        relation:
          $ref: '#/components/schemas/CrosswalkRelation'
        rationale:
          type: string
          maxLength: 2000
          minLength: 10
          title: Rationale
        asserted_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Asserted By
      type: object
      required:
      - source_standard
      - source_version
      - source_criterion
      - target_standard
      - target_version
      - target_criterion
      - relation
      - rationale
      title: CrosswalkRequest
    DependencyDefinition:
      properties:
        task_key:
          type: string
          maxLength: 128
          minLength: 1
          title: Task Key
        allowed_statuses:
          items:
            $ref: '#/components/schemas/TaskStatus'
          type: array
          uniqueItems: true
          title: Allowed Statuses
      additionalProperties: false
      type: object
      required:
      - task_key
      title: DependencyDefinition
    DisputeGround:
      type: string
      enum:
      - criteria_incorrect
      - condition_inaccurate
      - severity_overstated
      - materiality_disputed
      - evidence_superseded
      - compensating_control_omitted
      - out_of_scope
      title: DisputeGround
      description: 'The grounds on which management may contest a finding.


        A closed set, for the same reason the contradiction kinds are: "we disagree"

        is not reviewable, whereas "the criteria cite a superseded policy version"
        is.'
    DisputeResolution:
      type: string
      enum:
      - upheld
      - modified
      - withdrawn
      title: DisputeResolution
      description: 'How a dispute ends.


        ``MODIFIED`` is the consequential one: accepting that the finding needs to

        change voids the quality review and the approval it was granted under, because

        both were given for text that no longer stands.'
    EvidenceExportRequest:
      properties:
        evidence_ids:
          items:
            type: string
          type: array
          maxItems: 500
          minItems: 1
          title: Evidence Ids
        actor_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Actor Id
        purpose:
          type: string
          maxLength: 4000
          minLength: 1
          title: Purpose
        include_ancestors:
          type: boolean
          title: Include Ancestors
          default: true
      type: object
      required:
      - evidence_ids
      - actor_id
      - purpose
      title: EvidenceExportRequest
    EvidencePurgeRequest:
      properties:
        actor_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
        as_of:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: As Of
      type: object
      required:
      - actor_id
      - reason
      title: EvidencePurgeRequest
    EvidenceRetentionRequest:
      properties:
        actor_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Actor Id
        retention_until:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Retention Until
        legal_hold:
          type: boolean
          title: Legal Hold
          default: false
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
      type: object
      required:
      - actor_id
      - reason
      title: EvidenceRetentionRequest
    FactorAssertion:
      properties:
        factor:
          $ref: '#/components/schemas/QualitativeFactor'
        rationale:
          type: string
          maxLength: 2000
          minLength: 3
          title: Rationale
        evidence_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - factor
      - rationale
      - evidence_ids
      title: FactorAssertion
      description: 'A qualitative factor claimed to apply, with what supports it.


        ``evidence_ids`` is required and non-empty. This is the single control that

        stops materiality inflation: an agent that wants a higher severity has to

        point at a record, and a reviewer can follow the pointer.'
    FailureClass:
      type: string
      enum:
      - transient_infrastructure
      - connector_rate_limit
      - authentication_expired
      - source_schema_change
      - model_timeout
      - model_policy_violation
      - malformed_structured_output
      - deterministic_test_failure
      - insufficient_evidence
      - conflicting_evidence
      - human_response_overdue
      - revoked_authorization
      - security_incident
      - configuration_error
      - internal_error
      - lease_expired
      - human_rejected
      title: FailureClass
    GateDecision:
      properties:
        actor_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - actor_id
      - reason
      title: GateDecision
    GrantEntitlementRequest:
      properties:
        standard_code:
          type: string
          maxLength: 64
          minLength: 2
          title: Standard Code
        licence_ref:
          type: string
          maxLength: 255
          minLength: 1
          title: Licence Ref
        expires_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Expires On
        granted_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Granted By
      type: object
      required:
      - standard_code
      - licence_ref
      title: GrantEntitlementRequest
    GrantRevocationRequest:
      properties:
        actor_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
      type: object
      required:
      - actor_id
      - reason
      title: GrantRevocationRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HumanDecision:
      type: string
      enum:
      - approve
      - reject
      - return_for_rework
      - defer
      - accept_risk
      title: HumanDecision
    LaunchMode:
      type: string
      enum:
      - approval_required
      - preflight_then_approval
      - automatic
      title: LaunchMode
    MaterialityInputs:
      properties:
        population_size:
          type: integer
          minimum: 0.0
          title: Population Size
        exception_count:
          type: integer
          minimum: 0.0
          title: Exception Count
        monetary_exposure:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Monetary Exposure
        factors:
          items:
            $ref: '#/components/schemas/FactorAssertion'
          type: array
          title: Factors
      additionalProperties: false
      type: object
      required:
      - population_size
      - exception_count
      title: MaterialityInputs
      description: 'The measured facts a materiality score is computed from.


        The population and the exception count are counts from the deterministic test,

        not estimates. Requiring them here is what makes the score reproducible: two

        people with the same inputs and the same policy get the same number.'
    MaterialityPolicy:
      properties:
        policy_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Policy Id
          default: default-v1
        exception_rate_threshold:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Exception Rate Threshold
          default: 0.05
        population_floor:
          type: integer
          minimum: 0.0
          title: Population Floor
          default: 20
        monetary_threshold:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Monetary Threshold
        factor_weights:
          additionalProperties:
            type: number
          propertyNames:
            $ref: '#/components/schemas/QualitativeFactor'
          type: object
          title: Factor Weights
        severity_bands:
          items:
            prefixItems:
            - type: number
            - type: string
            type: array
            maxItems: 2
            minItems: 2
          type: array
          title: Severity Bands
      additionalProperties: false
      type: object
      title: MaterialityPolicy
      description: 'The configured thresholds a materiality score is measured against.


        Held as data, versioned by ``policy_id``, and stored with every assessment
        so

        a score computed under an old policy stays interpretable after the policy

        changes.'
    MissedOccurrencePolicy:
      type: string
      enum:
      - launch_all
      - launch_latest
      - skip
      title: MissedOccurrencePolicy
    OccurrenceDecision:
      properties:
        actor_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
        preflight_context:
          $ref: '#/components/schemas/PreflightContext'
      additionalProperties: false
      type: object
      required:
      - actor_id
      - reason
      title: OccurrenceDecision
    OpenRemediationRequest:
      properties:
        owner_ref:
          type: string
          maxLength: 255
          minLength: 1
          title: Owner Ref
        due_date:
          type: string
          format: date
          title: Due Date
        action_plan:
          type: string
          maxLength: 4000
          minLength: 3
          title: Action Plan
        idempotency_key:
          type: string
          maxLength: 255
          minLength: 3
          title: Idempotency Key
        closure_evidence_required:
          type: boolean
          title: Closure Evidence Required
          default: true
        escalation_policy:
          additionalProperties: true
          type: object
          title: Escalation Policy
        external_system:
          type: string
          enum:
          - none
          - jira
          - servicenow
          title: External System
          default: none
        external_target:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: External Target
      type: object
      required:
      - owner_ref
      - due_date
      - action_plan
      - idempotency_key
      title: OpenRemediationRequest
    OverlapPolicy:
      type: string
      enum:
      - prevent
      - allow
      title: OverlapPolicy
    OverrideSeverityRequest:
      properties:
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          title: Severity
        reason:
          type: string
          maxLength: 4000
          minLength: 10
          title: Reason
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
      type: object
      required:
      - severity
      - reason
      title: OverrideSeverityRequest
    PreflightContext:
      properties:
        connector_health:
          additionalProperties:
            type: string
          type: object
          title: Connector Health
        available_budget_usd:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Available Budget Usd
        available_competencies:
          items:
            type: string
          type: array
          uniqueItems: true
          title: Available Competencies
        independence_conflicts:
          items:
            type: string
          type: array
          uniqueItems: true
          title: Independence Conflicts
        attributes:
          additionalProperties: true
          type: object
          title: Attributes
      additionalProperties: false
      type: object
      title: PreflightContext
    ProposeFindingRequest:
      properties:
        finding:
          $ref: '#/components/schemas/ProposedFinding'
        exception_rows:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Exception Rows
        approved_exceptions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Approved Exceptions
        compensating_controls:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Compensating Controls
        period_start:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Period Start
        period_end:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Period End
        authored_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Authored By
      type: object
      required:
      - finding
      title: ProposeFindingRequest
      description: 'A proposed finding plus the canonical context the skeptic consults.


        The context is supplied by the caller rather than assumed, because which

        exception register and which audit period apply is an engagement fact. An

        absent register produces no contradiction of that kind rather than a silent

        pass.'
    ProposedFinding:
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_-]{2,63}$
          title: Code
        title:
          type: string
          maxLength: 255
          minLength: 3
          title: Title
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          title: Severity
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        criteria:
          type: string
          minLength: 3
          title: Criteria
        observed_condition:
          type: string
          minLength: 3
          title: Observed Condition
        risk_statement:
          type: string
          minLength: 3
          title: Risk Statement
        cause:
          anyOf:
          - type: string
          - type: 'null'
          title: Cause
        consequence:
          anyOf:
          - type: string
          - type: 'null'
          title: Consequence
        business_objective:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Objective
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        exception_keys:
          items:
            type: string
          type: array
          title: Exception Keys
        affected_population:
          additionalProperties: true
          type: object
          title: Affected Population
        limitations:
          items:
            type: string
          type: array
          title: Limitations
        source_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Run Id
      additionalProperties: false
      type: object
      required:
      - code
      - title
      - severity
      - confidence
      - criteria
      - observed_condition
      - risk_statement
      title: ProposedFinding
      description: 'A finding an agent proposes from an accepted control-test exception.


        ``confidence`` is the agent''s, and it is never sufficient on its own: the

        human gate is a separate record, not a threshold on this number.'
    QualitativeFactor:
      type: string
      enum:
      - regulatory_reportable
      - fraud_indicator
      - repeat_finding
      - customer_impact
      - financial_statement_impact
      - pervasive_across_units
      - control_environment_weakness
      - management_override
      title: QualitativeFactor
      description: 'The named ways a numerically small exception can still matter.


        A closed set rather than free text. Free-text factors cannot be weighted by
        a

        policy, cannot be compared across engagements, and cannot be audited for

        over-use by an agent that has learned they raise severity.'
    RaiseDisputeRequest:
      properties:
        ground:
          $ref: '#/components/schemas/DisputeGround'
        statement:
          type: string
          maxLength: 4000
          minLength: 10
          title: Statement
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        raised_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Raised By
      type: object
      required:
      - ground
      - statement
      title: RaiseDisputeRequest
    RecordRetestRequest:
      properties:
        procedure_ref:
          type: string
          maxLength: 255
          minLength: 1
          title: Procedure Ref
        idempotency_key:
          type: string
          maxLength: 255
          minLength: 3
          title: Idempotency Key
        outcome:
          $ref: '#/components/schemas/RetestOutcome'
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        detail:
          type: string
          maxLength: 4000
          title: Detail
          default: ''
        fresh_evidence_collected_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Fresh Evidence Collected At
        performed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Performed By
      type: object
      required:
      - procedure_ref
      - idempotency_key
      - outcome
      title: RecordRetestRequest
    RegisterStandardRequest:
      properties:
        standard:
          $ref: '#/components/schemas/StandardInput'
        criteria:
          items:
            $ref: '#/components/schemas/CriterionInput'
          type: array
          title: Criteria
      type: object
      required:
      - standard
      title: RegisterStandardRequest
    ResolveDisputeRequest:
      properties:
        resolution:
          $ref: '#/components/schemas/DisputeResolution'
        reason:
          type: string
          maxLength: 4000
          minLength: 10
          title: Reason
        resolved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolved By
      type: object
      required:
      - resolution
      - reason
      title: ResolveDisputeRequest
    RetestOutcome:
      type: string
      enum:
      - closed_verified
      - partially_remediated
      - ineffective
      - insufficient_evidence
      - reopen
      title: RetestOutcome
    RetryPolicy:
      properties:
        max_attempts:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Max Attempts
          default: 3
        initial_delay_seconds:
          type: number
          minimum: 0.0
          title: Initial Delay Seconds
          default: 5.0
        backoff_multiplier:
          type: number
          minimum: 1.0
          title: Backoff Multiplier
          default: 2.0
        max_delay_seconds:
          type: number
          minimum: 0.0
          title: Max Delay Seconds
          default: 300.0
        retryable_failures:
          items:
            $ref: '#/components/schemas/FailureClass'
          type: array
          uniqueItems: true
          title: Retryable Failures
      additionalProperties: false
      type: object
      title: RetryPolicy
    ReviewQualityRequest:
      properties:
        notes:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Notes
        reviewer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewer Id
      type: object
      title: ReviewQualityRequest
    ScheduleDecision:
      properties:
        actor_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Actor Id
        reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - actor_id
      - reason
      title: ScheduleDecision
    ScheduleDraftInput:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        plan_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Plan Id
        template_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Template Id
        recurrence_rule:
          type: string
          maxLength: 2000
          minLength: 1
          title: Recurrence Rule
        timezone:
          type: string
          maxLength: 64
          minLength: 1
          title: Timezone
          default: UTC
        effective_from:
          type: string
          format: date-time
          title: Effective From
        effective_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Effective Until
        audit_period_rule:
          $ref: '#/components/schemas/AuditPeriodRule'
        business_calendar:
          $ref: '#/components/schemas/BusinessCalendarConfig'
        blackout_policy:
          $ref: '#/components/schemas/BlackoutPolicy'
        preflight_policy:
          additionalProperties: true
          type: object
          title: Preflight Policy
        launch_mode:
          $ref: '#/components/schemas/LaunchMode'
          default: approval_required
        missed_occurrence_policy:
          $ref: '#/components/schemas/MissedOccurrencePolicy'
          default: launch_latest
        catch_up_limit:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Catch Up Limit
          default: 12
        overlap_policy:
          $ref: '#/components/schemas/OverlapPolicy'
          default: prevent
        max_concurrent_engagements:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Max Concurrent Engagements
          default: 1
      additionalProperties: false
      type: object
      required:
      - name
      - plan_id
      - template_id
      - recurrence_rule
      - effective_from
      title: ScheduleDraftInput
    ScheduleEvaluationRequest:
      properties:
        context:
          $ref: '#/components/schemas/PreflightContext'
        worker_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Worker Id
          default: api-scheduler
        lease_seconds:
          type: integer
          maximum: 3600.0
          minimum: 1.0
          title: Lease Seconds
          default: 60
      type: object
      title: ScheduleEvaluationRequest
    ScheduleSimulationRequest:
      properties:
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
        limit:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          default: 500
      type: object
      required:
      - window_start
      - window_end
      title: ScheduleSimulationRequest
    StandardInput:
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 2
          title: Code
        name:
          type: string
          maxLength: 255
          minLength: 2
          title: Name
        issuer:
          type: string
          maxLength: 255
          minLength: 2
          title: Issuer
        version:
          type: string
          maxLength: 32
          minLength: 1
          title: Version
        jurisdiction:
          type: string
          maxLength: 64
          title: Jurisdiction
          default: global
        licence:
          type: string
          maxLength: 128
          title: Licence
          default: internal
        entitlement_required:
          type: boolean
          title: Entitlement Required
          default: false
        effective_from:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective From
        effective_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective To
        source_url:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Source Url
      additionalProperties: false
      type: object
      required:
      - code
      - name
      - issuer
      - version
      title: StandardInput
      description: 'A versioned body of criteria, with its licensing position.


        ``entitlement_required`` is the field that matters operationally. Several

        standards bodies licence their text, and an audit platform that reproduces

        licensed criteria for a tenant with no entitlement has a legal problem, not
        a

        product feature. It is declared here so the compiler can refuse.'
    SubmitClosureRequest:
      properties:
        response_text:
          type: string
          maxLength: 4000
          minLength: 3
          title: Response Text
        closure_evidence_ids:
          items:
            type: string
          type: array
          title: Closure Evidence Ids
        action_plan:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Plan
        submitted_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Submitted By
      type: object
      required:
      - response_text
      title: SubmitClosureRequest
    TaskClaimRequest:
      properties:
        worker_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Worker Id
        lease_seconds:
          type: integer
          maximum: 3600.0
          minimum: 1.0
          title: Lease Seconds
          default: 60
        engagement_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Engagement Id
        task_types:
          items:
            type: string
          type: array
          maxItems: 100
          title: Task Types
        agent_roles:
          items:
            type: string
          type: array
          maxItems: 100
          title: Agent Roles
      type: object
      required:
      - worker_id
      title: TaskClaimRequest
    TaskCompletionRequest:
      properties:
        worker_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Worker Id
        result:
          $ref: '#/components/schemas/TaskExecutionResult'
      type: object
      required:
      - worker_id
      - result
      title: TaskCompletionRequest
    TaskDefinition:
      properties:
        key:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9._-]*$
          title: Key
        task_type:
          type: string
          maxLength: 64
          minLength: 1
          title: Task Type
        definition_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Definition Version
          default: '1'
        dependencies:
          items:
            $ref: '#/components/schemas/DependencyDefinition'
          type: array
          title: Dependencies
        assigned_agent_role:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Assigned Agent Role
        input_refs:
          items:
            type: string
          type: array
          title: Input Refs
        execution_policy:
          additionalProperties: true
          type: object
          title: Execution Policy
        model_policy:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Model Policy
        tool_policy:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Tool Policy
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        priority:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Priority
          default: 100
        deadline_seconds:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Deadline Seconds
        human_gate:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Human Gate
        human_gate_position:
          type: string
          enum:
          - before
          - after
          title: Human Gate Position
          default: before
      additionalProperties: false
      type: object
      required:
      - key
      - task_type
      title: TaskDefinition
    TaskExecutionResult:
      properties:
        output_refs:
          items:
            type: string
          type: array
          title: Output Refs
        result:
          additionalProperties: true
          type: object
          title: Result
      additionalProperties: false
      type: object
      title: TaskExecutionResult
    TaskFailureRequest:
      properties:
        worker_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Worker Id
        failure_class:
          $ref: '#/components/schemas/FailureClass'
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
        force_retryable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Force Retryable
      type: object
      required:
      - worker_id
      - failure_class
      - message
      title: TaskFailureRequest
    TaskHeartbeatRequest:
      properties:
        worker_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Worker Id
        lease_seconds:
          type: integer
          maximum: 3600.0
          minimum: 1.0
          title: Lease Seconds
          default: 60
      type: object
      required:
      - worker_id
      title: TaskHeartbeatRequest
    TaskStatus:
      type: string
      enum:
      - pending
      - ready
      - running
      - retry_wait
      - waiting_approval
      - succeeded
      - failed
      - blocked
      - cancelled
      - skipped
      title: TaskStatus
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkflowDefinition:
      properties:
        workflow_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Workflow Version
        tasks:
          items:
            $ref: '#/components/schemas/TaskDefinition'
          type: array
          minItems: 1
          title: Tasks
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - workflow_version
      - tasks
      title: WorkflowDefinition
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
