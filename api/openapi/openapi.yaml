      description: 'Why evidence gathered for one purpose may support another.


        Reuse is normal and is not free. Evidence collected for a different engagement

        or a different period was collected under a different scope, and carrying
        it

        across without saying so is how a conclusion about this year quietly rests
        on

        last year''s sample.'
